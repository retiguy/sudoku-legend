<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sudoku Legend</title><style>:root{--bg:#0d1220;--card:#192236;--gold:#f2c66d;--text:#f5f5fa;--muted:#a0acc2;--line:#48536a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#26334d,var(--bg) 70%);font-family:system-ui,sans-serif;color:var(--text)}main{max-width:520px;margin:auto;padding:20px 15px 35px}h1{font-size:27px;letter-spacing:2px;color:var(--gold);margin:7px 0}header{display:flex;justify-content:space-between;align-items:center}.badge{background:#2a354c;padding:9px 12px;border-radius:14px;color:var(--gold);font-weight:bold}.sub{color:var(--muted);font-size:13px}.progress{height:8px;background:#303b50;border-radius:10px;margin:10px 0 20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--gold)}.panel{background:var(--card);border:1px solid #35415a;border-radius:20px;padding:15px;box-shadow:0 10px 30px #0003}.toolbar{display:flex;justify-content:space-between;gap:7px;align-items:center;margin-bottom:13px}.toolbar select,.toolbar button{background:#29364e;color:white;border:1px solid #4b5a73;border-radius:10px;padding:9px;font-size:13px}.stats{display:flex;justify-content:space-around;margin-bottom:14px;color:var(--muted);font-size:13px}.stats b{color:var(--gold)}#board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;background:#40506c;border:2px solid var(--gold);border-radius:7px;overflow:hidden}.cell{display:flex;align-items:center;justify-content:center;min-width:0;font-size:clamp(15px,5vw,25px);font-weight:650;border-right:1px solid #3d4960;border-bottom:1px solid #3d4960;background:#202b40;color:#f4f5fa;cursor:pointer;user-select:none}.cell:nth-child(3n){border-right:2px solid #b1a078}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #b1a078}.cell.given{color:#aebbd0;background:#192338}.cell.peer{background:#2b3d55}.cell.same{background:#435477}.cell.selected{background:#806738;color:#fff}.cell.error{color:#ff7e8c}.cell.notes{font-size:10px;white-space:pre-wrap;line-height:1.15;text-align:center;color:#d6bf8d}.numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:17px}.numbers button{padding:12px 0;background:#27364d;border:1px solid #475875;border-radius:10px;color:var(--gold);font-size:22px;font-weight:bold}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;padding:12px 3px;background:#303c52;color:white;border:1px solid #4a5870;border-radius:11px;font-weight:600}.actions button.active{background:#7b6030;color:#fff}.foot{margin-top:18px;color:var(--muted);text-align:center;font-size:12px}button:active{transform:scale(.96)}</style></head><body><main><header><div><div class="sub">PREMIUM PUZZLE RPG</div><h1>SUDOKU LEGEND</h1></div><div class="badge" id="level">LV. 1</div></header><div class="sub" id="xpLabel">EXP 0 / 100 · 🪙 0</div><div class="progress"><i id="xpBar"></i></div><div class="panel"><div class="toolbar"><select id="difficulty"><option value="easy">초급</option><option value="medium">중급</option><option value="hard">고급</option><option value="expert">전문가</option></select><button id="newGame">새 게임</button><button id="reset">초기화</button></div><div class="stats"><span>⏱ <b id="timer">00:00</b></span><span>🏆 완료 <b id="wins">0</b></span><span>🔥 연속 <b id="streak">0</b></span></div><div id="board"></div><div class="numbers" id="numbers"></div><div class="actions"><button id="erase">지우기</button><button id="notes">✎ 메모 OFF</button><button id="undo">↶ 취소</button><button id="hint">💡 힌트</button></div></div><div class="foot">퍼즐은 오프라인에서도 플레이할 수 있습니다.</div></main><script>
const $=id=>document.getElementById(id),KEY='sudoku-legend-v1';let state,selected=-1,notesMode=false,history=[],timerHandle;
const clone=x=>JSON.parse(JSON.stringify(x));
function solvedBoard(){let base=[1,2,3,4,5,6,7,8,9],shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let rows=[],cols=[];for(let band of shuffle([0,1,2]))for(let r of shuffle([0,1,2]))rows.push(band*3+r);for(let band of shuffle([0,1,2]))for(let c of shuffle([0,1,2]))cols.push(band*3+c);let digits=shuffle(base.slice());return rows.map(r=>cols.map(c=>digits[(r*3+Math.floor(r/3)+c)%9]));}
function candidates(grid,r,c){let used=new Set([...grid[r],...grid.map(row=>row[c])]);for(let y=Math.floor(r/3)*3;y<Math.floor(r/3)*3+3;y++)for(let x=Math.floor(c/3)*3;x<Math.floor(c/3)*3+3;x++)used.add(grid[y][x]);return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n));}
function countSolutions(g,limit=2){let best=null,opts=null;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!g[r][c]){let o=candidates(g,r,c);if(!o.length)return 0;if(!opts||o.length<opts.length){best=[r,c];opts=o;if(o.length===1)break}}if(!best)return 1;let total=0;for(let n of opts){g[best[0]][best[1]]=n;total+=countSolutions(g,limit-total);g[best[0]][best[1]]=0;if(total>=limit)return total}return total;}
function generate(diff){let solution=solvedBoard(),puzzle=clone(solution),targets={easy:38,medium:46,hard:52,expert:56},removed=0,positions=Array.from({length:81},(_,i)=>i);for(let i=80;i>0;i--){let j=Math.floor(Math.random()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]]}for(let p of positions){if(removed>=targets[diff])break;let r=Math.floor(p/9),c=p%9,old=puzzle[r][c];puzzle[r][c]=0;if(countSolutions(puzzle)!==1)puzzle[r][c]=old;else removed++}return {solution,puzzle};}
function profile(){return JSON.parse(localStorage.getItem('sudoku-profile')||'{"xp":0,"coins":0,"wins":0,"streak":0}')}function saveProfile(p){localStorage.setItem('sudoku-profile',JSON.stringify(p))}function renderProfile(){let p=profile(),lvl=Math.floor(p.xp/100)+1;$('level').textContent='LV. '+lvl;$('xpLabel').textContent=`EXP ${p.xp%100} / 100 · 🪙 ${p.coins}`;$('xpBar').style.width=p.xp%100+'%';$('wins').textContent=p.wins;$('streak').textContent=p.streak}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function newGame(){let diff=$('difficulty').value,{solution,puzzle}=generate(diff);state={diff,solution,puzzle,values:clone(puzzle),notes:{},seconds:0,finished:false};selected=-1;history=[];save();render();}function render(){if(!state)return;$('difficulty').value=state.diff;$('timer').textContent=String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0');let board=$('board');board.innerHTML='';for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9,v=state.values[r][c],cell=document.createElement('div');cell.className='cell';if(state.puzzle[r][c])cell.classList.add('given');if(selected>=0){let sr=Math.floor(selected/9),sc=selected%9,sv=state.values[sr][sc];if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))cell.classList.add('peer');if(v&&v===sv)cell.classList.add('same');if(i===selected)cell.classList.add('selected')}if(v&&v!==state.solution[r][c])cell.classList.add('error');if(v)cell.textContent=v;else if(state.notes[i]?.length){cell.classList.add('notes');cell.textContent=[1,2,3,4,5,6,7,8,9].map(n=>state.notes[i].includes(n)?n:'·').join(' ')}cell.onclick=()=>{selected=i;render()};board.appendChild(cell)}renderProfile()}
function snapshot(){history.push({values:clone(state.values),notes:clone(state.notes)});if(history.length>100)history.shift()}function enter(n){if(state.finished||selected<0)return;let r=Math.floor(selected/9),c=selected%9;if(state.puzzle[r][c])return;snapshot();if(notesMode&&n){let a=state.notes[selected]||[];state.notes[selected]=a.includes(n)?a.filter(x=>x!==n):[...a,n].sort();}else{state.values[r][c]=n;delete state.notes[selected]}save();render();checkWin()}
function checkWin(){if(state.finished)return;if(state.values.every((row,r)=>row.every((v,c)=>v===state.solution[r][c]))){state.finished=true;let p=profile(),reward={easy:20,medium:35,hard:55,expert:80}[state.diff];p.xp+=reward;p.coins+=reward;p.wins++;p.streak++;saveProfile(p);save();render();setTimeout(()=>alert(`🎉 퍼즐 완료!\n+${reward} EXP · +${reward} 코인`),80)}}
$('numbers').innerHTML=Array.from({length:9},(_,i)=>`<button data-n="${i+1}">${i+1}</button>`).join('');$('numbers').onclick=e=>{let n=Number(e.target.dataset.n);if(n)enter(n)};$('erase').onclick=()=>enter(0);$('notes').onclick=()=>{notesMode=!notesMode;$('notes').textContent='✎ 메모 '+(notesMode?'ON':'OFF');$('notes').classList.toggle('active',notesMode)};$('undo').onclick=()=>{if(!history.length||state.finished)return;Object.assign(state,history.pop());save();render()};$('hint').onclick=()=>{if(selected<0||state.finished)return;let r=Math.floor(selected/9),c=selected%9;if(state.puzzle[r][c])return;snapshot();state.values[r][c]=state.solution[r][c];delete state.notes[selected];save();render();checkWin()};$('newGame').onclick=()=>{if(confirm('새 퍼즐을 시작할까요?'))newGame()};$('reset').onclick=()=>{if(confirm('현재 퍼즐을 처음부터 다시 풀까요?')){state.values=clone(state.puzzle);state.notes={};state.seconds=0;state.finished=false;history=[];save();render()}};document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')enter(Number(e.key));if(e.key==='Backspace'||e.key==='Delete')enter(0)});try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!state.solution||!state.values)throw Error();render()}catch(e){newGame()}timerHandle=setInterval(()=>{if(state&&!state.finished){state.seconds++;$('timer').textContent=String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0');if(state.seconds%5===0)save()}},1000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script></body></html>
